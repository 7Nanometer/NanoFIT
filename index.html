<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <!-- PWA 清单：手机靠它才知道"这个网页可以装到桌面当 App 用"，
         以及装上去之后叫什么名字、用什么图标、显示成什么颜色 -->
    <link rel="manifest" href="./manifest.webmanifest" />

    <!-- iPhone 专用：加到主屏幕后用这张图当图标。
         苹果不认上面清单里的图标，必须单独写这一行。 -->
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />

    <!-- 告诉 iPhone：加到主屏幕后要像真 App 一样全屏打开，别显示地址栏 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="NanoFIT" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <!-- viewport-fit=cover：允许页面铺到 iPhone 的"刘海"和底部横条区域。
         必须配合 CSS 里的安全区留白一起用，否则底部那排按钮会被横条盖住。 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- theme-color：手机上地址栏/状态栏会跟着变成这个颜色。
         日间模式时下面的小脚本会把它改成白色。
         ★ 这个值必须和 index.css 里 --color-bg 的夜间值保持一致 ——
           它只在 JS 跑起来之前的那一瞬间有用（跑起来之后由
           src/lib/theme.ts 接管），对不上就会闪一下颜色。 -->
    <meta name="theme-color" content="#0a0a0c" />

    <meta
      name="description"
      content="NanoFIT — 本地健身记录本。数据只存在你自己手机上，不联网、不注册。"
    />

    <title>NanoFIT</title>

    <!-- 【防止开屏闪一下白光】这段必须放在样式表之前跑。
         如果不写，打开 App 时浏览器会先按默认的浅色画一遍，
         等 React 启动后再把主题挂上去 —— 夜间模式的用户就会看到白光一闪。
         这里直接读储物柜，在第一帧画出来之前就把 data-theme 挂好。
         用 var 和 catch 是因为：隐私模式下 localStorage 可能不让读，
         读不到就当夜间处理，绝不能让这段小脚本把整个页面搞挂。 -->
    <script>
      var nanoTheme = 'dark'
      try {
        var saved = JSON.parse(
          localStorage.getItem('nanofit:v1:settings') || '{}',
        )
        if (saved.theme === 'light') nanoTheme = 'light'
      } catch (err) {
        /* 读不到就按夜间处理，绝不能让这段小脚本把整个页面搞挂 */
      }
      document.documentElement.dataset.theme = nanoTheme
      if (nanoTheme === 'light') {
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', '#ffffff')
      }
    </script>
  </head>
  <body>
    <!-- 整个 App 会被 React 画进这个 div 里 -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
